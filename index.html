
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>A Little Apology 💌</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,serif;background:linear-gradient(135deg,#fff0f5,#ffe4ec,#fff7f0);color:#633c48;display:flex;justify-content:center;align-items:center;overflow:hidden}.petal{position:fixed;font-size:25px;animation:fall 7s linear infinite;opacity:.7;pointer-events:none}@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}.card{width:90%;max-width:500px;text-align:center;background:rgba(255,255,255,.78);padding:35px 25px;border-radius:30px;box-shadow:0 15px 45px #b86f8240;backdrop-filter:blur(8px);animation:appear 1.2s ease}@keyframes appear{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}.card img{width:190px;max-height:210px;object-fit:contain;filter:drop-shadow(0 8px 8px #8b536233)}h1{font-size:36px;margin:10px 0;color:#a64d68}p{font-size:18px;line-height:1.7}.btn{display:inline-block;margin-top:18px;padding:14px 28px;border-radius:30px;background:#c76580;color:white;text-decoration:none;font-size:17px;box-shadow:0 7px 18px #c7658050;transition:.3s}.btn:hover{transform:translateY(-3px);background:#ad4d69}
</style>
</head>
<body>
<div class="petal" style="left:8%;animation-delay:0s">🌸</div><div class="petal" style="left:25%;animation-delay:2s">🌷</div><div class="petal" style="left:48%;animation-delay:4s">🌹</div><div class="petal" style="left:70%;animation-delay:1s">🌸</div><div class="petal" style="left:88%;animation-delay:3s">🌷</div>
<div class="card">
<img src="images/teddy1.png" alt="Cute teddy bear">
<h1>I Owe You An Apology… 💌</h1>
<p>Sometimes saying “sorry” isn't enough… but I still want to try. I made this little page just for you, because you deserve to hear what's truly in my heart.</p>
<a class="btn" href="sorry.html">Open My Apology 🌷</a>
</div>
</body>
</html>
